<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center py-40px min-h-100vh">
<div class="stage">
  <div class="card relative w-full bg-white rounded-26px shadow-lg min-h-392px" id="card">

    <!-- IDLE -->
<div class="panel flex-col items-center text-center" id="panel-idle">
  <div class="card-header w-full flex items-center justify-center mb-16px">
    <span class="card-title font-600-19px">Voice Navigation</span>
    <button class="close-btn border-0 bg-transparent cursor-pointer p-0" aria-label="Close" id="closeBtn">
      <svg viewBox="0 0 24 24" fill="black" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-20px h-20px text-ink-500">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
  <div class="flex-center rounded-full bg-purple-600 w-72px h-72px mb-16px" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mic-icon">
      <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
      <path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/>
    </svg>
  </div>

  <h2 class="heading font-600-16px m-0-0-18px">How can I help you?</h2>

  <span class="try-label font-13px font-weight-500 text-ink-500 mb-10px">Try saying:</span>
  <div class="chip-grid w-full grid grid-cols-2 gap-9px mb-20px" id="chipGrid">
    <button class="chip flex items-center gap-7px p-11px border-0 rounded-full-lg font-12-5px font-weight-500 text-ink-900 text-left cursor-pointer transition-all line-height-1-25" data-command="Show my Aadhaar">
     <svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="black"/></svg>Show my Aadhaar</button>
    <button class="chip flex items-center gap-7px p-11px border-0 rounded-full-lg font-12-5px font-weight-500 text-ink-900 text-left cursor-pointer transition-all line-height-1-25" data-command="Search Driving Licence">
      <svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="black"/></svg>Search Driving Licence </button>
    <button class="chip flex items-center gap-7px p-11px border-0 rounded-full-lg font-12-5px font-weight-500 text-ink-900 text-left cursor-pointer transition-all line-height-1-25" data-command="Go to Issued Documents">
      <svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="black"/></svg>Go to Issued Documents </button>
    <button class="chip flex items-center gap-7px p-11px border-0 rounded-full-lg font-12-5px font-weight-500 text-ink-900 text-left cursor-pointer transition-all line-height-1-25" data-command="Download my PAN card">
      <svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="black"/></svg>Download my PAN card </button>
    <button class="chip flex items-center gap-7px p-11px border-0 rounded-full-lg font-12-5px font-weight-500 text-ink-900 text-left cursor-pointer transition-all line-height-1-25" data-command="Help">
      <svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="black"/></svg>Help</button>
  </div>
  <button class="speak-btn" id="micAvatar" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mic-icon">
      <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="white"/>
      <path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/>
    </svg>
    <span>Tap to speak</span>
  </button>
</div>
    <!-- LISTENING -->
    <div class="panel" id="panel-listening" hidden>
      <div class="card-header"><span class="card-title">Voice Navigation</span>
        <button class="close-btn border-0 bg-transparent cursor-pointer p-0" aria-label="Close" id="closeBtn2"><svg viewBox="0 0 24 24" fill="black" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-20px h-20px text-ink-500"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="sonar relative flex items-center justify-center" id="sonar">
        <div class="sonar-ring absolute rounded-full bg-purple-400 inset-0 r1"></div>
        <div class="sonar-ring absolute rounded-full bg-purple-400 inset-0 r2"></div>
        <div class="sonar-ring absolute rounded-full bg-purple-400 inset-0 r3"></div>
        <div class="mic-core relative rounded-full bg-gradient-purple flex-center shadow-avatar">
          <svg viewBox="0 0 24 24" class="mic-icon" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="white"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
        </div>
      </div>
      <h2 class="heading">Listening...</h2>
      <p class="sub-text" id="listeningSub">Please say a command</p>
      <button class="cancel-btn flex items-center gap-7px rounded-full-lg border-1-5px cursor-pointer transition-btn" id="cancelBtn">
        <svg viewBox="0 0 24 24" fill="black" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-14px h-14px" ><path d="M18 6 6 18M6 6l12 12"/></svg>Cancel
      </button>
    </div>

    <!-- YOU SAID -->
    <div class="panel" id="panel-verification" hidden>
      <div class="card-header"><span class="card-title">Voice Navigation</span>
        <button class="close-btn border-0 bg-transparent cursor-pointer p-0" aria-label="Close" id="closeBtn3"><svg viewBox="0 0 24 24" fill="black" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-20px h-20px text-ink-500"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <span class="verify-label">You said:</span>
      <p class="verify-text" id="verifyText">Show my Aadhaar</p>
      <div class="waveform" aria-hidden="true"></div>
      <div class="verify-actions flex items-center">
        <button class="verify-btn verify-retry flex items-center justify-center gap-6px border-1-5px cursor-pointer" id="retryBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-14px h-14px"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>Try Again
        </button>
        <button class="verify-btn verify-continue flex items-center justify-center gap-6px border-0 text-white cursor-pointer" id="continueBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-14px h-14px"><circle cx="12" cy="12" r="10"/><polyline points="12 16 16 12 12 8"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Continue
        </button>
      </div>
    </div>

    <!-- RESULT -->
    <div class="panel" id="panel-result" hidden>
      <div>
        <button class="close-btn border-0 bg-transparent cursor-pointer p-0" aria-label="Close" id="closeBtn4">
          <svg viewBox="0 0 24 24" fill="black" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-20px h-20px text-ink-500">
            <path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="result-icon-wrapper flex items-center justify-center rounded-full">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v3"/><path d="M14 3v5h5"/><path d="M8.5 12h4M8.5 15h2"/>
          <circle class="badge" cx="17" cy="17" r="4.5" fill="#25B172" stroke="none"/>
          <path d="M15.1 17l1.4 1.4 2.5-2.7" stroke="#fff" stroke-width="1.6"/>
        </svg>
      </div>
      <p class="result-command" id="resultCommand">Opening Driving Licence</p>
      <p class="result-sub">Please wait...</p>
      <div class="loader-dots flex items-center justify-center gap-6px">
        <span class="loader-dot animate-bounce" style="animation-delay:0s"></span>
        <span class="loader-dot animate-bounce" style="animation-delay:.2s"></span>
        <span class="loader-dot animate-bounce" style="animation-delay:.4s"></span>
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
