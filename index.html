<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center py-40px min-h-100vh">

<div class="stage">
  <div class="card relative w-full bg-white rounded-26px shadow-lg min-h-392px" id="card">

    <!-- IDLE -->
    <div class="panel flex-col items-center text-center" id="panel-idle">
      <div class="card-header flex items-center justify-between mb-4px">
        <span class="card-title font-weight-600">Voice Navigation</span>
        </button>
      </div>

      <button class="idle-avatar relative rounded-full bg-gradient-purple flex-center cursor-pointer border-0 p-0 w-72px h-72px m-16px-0 shadow-md" id="micAvatar" aria-label="Start voice navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-28px h-28px">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
          <path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>
        </svg>
      </button>

      <h2 class="heading font-600-19px m-0-0-18px">How can I help you ?</h2>

      <span class="try-label ml-auto font-12-5px font-weight-600 text-ink-500 text-uppercase tracking-06em mb-10px">Try saying</span>
      <div class="chip-grid w-full grid grid-cols-2 gap-9px mb-9px" id="chipGrid">
        <button class="chip flex items-center gap-7px p-11px bg-purple-050 border-1px rounded-12px font-12-5px font-weight-500 text-ink-900 text-left cursor-pointer transition-all line-height-1-25" data-command="Show my Aadhaar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-15px h-15px shrink-0 text-purple-600"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2"/><path d="M15 10h3M15 14h3"/></svg>
          Show my Aadhaar
        </button>
        <button class="chip flex items-center gap-7px p-11px bg-purple-050 border-1px rounded-12px font-12-5px font-weight-500 text-ink-900 text-left cursor-pointer transition-all line-height-1-25" data-command="Search Driving Licence">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-15px h-15px shrink-0 text-purple-600"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          Search Driving Licence
        </button>
        <button class="chip flex items-center gap-7px p-11px bg-purple-050 border-1px rounded-12px font-12-5px font-weight-500 text-ink-900 text-left cursor-pointer transition-all line-height-1-25" data-command="Go to Issued Documents">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-15px h-15px shrink-0 text-purple-600"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
          Go to Issued Documents
        </button>
        <button class="chip flex items-center gap-7px p-11px bg-purple-050 border-1px rounded-12px font-12-5px font-weight-500 text-ink-900 text-left cursor-pointer transition-all line-height-1-25" data-command="Download my PAN card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-15px h-15px shrink-0 text-purple-600"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          Download my PAN card
        </button>
        <button class="chip chip-help flex items-center justify-center grid-full gap-7px p-11px bg-transparent border-1px border-dashed rounded-12px font-12-5px font-weight-500 text-ink-500 text-left cursor-pointer transition-all line-height-1-25" data-command="Help">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-15px h-15px shrink-0 text-purple-600"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 1.5-2.5 3.5"/><path d="M12 17h.01"/></svg>
          Help
        </button>
      </div>
    </div>

    <!-- LISTENING -->
    <div class="panel flex-col items-center" id="panel-listening" hidden>
      <div class="card-header flex items-center justify-between mb-4px">
        <span class="card-title font-weight-600">Voice Navigation</span>
        </button>
      </div>

      <div class="sonar relative w-150px h-150px flex items-center justify-center m-18px-0-20px" id="sonar">
        <div class="sonar-ring absolute rounded-full bg-purple-400 m-0 inset-0 opacity-0 r1"></div>
        <div class="sonar-ring absolute rounded-full bg-purple-400 m-0 inset-0 opacity-0 r2"></div>
        <div class="sonar-ring absolute rounded-full bg-purple-400 m-0 inset-0 opacity-0 r3"></div>
        <div class="mic-core relative rounded-full bg-gradient-purple flex-center cursor-pointer w-74px h-74px shadow-avatar z-2">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-30px h-30px">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
            <path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>
          </svg>
        </div>
      </div>

      <div class="wave-bars flex items-end gap-4px h-16px mb-6px" aria-hidden="true">
        <span class="w-3px rounded-2px bg-purple-500"></span><span class="w-3px rounded-2px bg-purple-500"></span><span class="w-3px rounded-2px bg-purple-500"></span><span class="w-3px rounded-2px bg-purple-500"></span><span class="w-3px rounded-2px bg-purple-500"></span>
      </div>

      <h2 class="heading font-600-19px mb-2px">Listening...</h2>
      <p class="sub-text font-13-5px text-ink-500 m-2px-0-22px" id="listeningSub">Please say a command</p>

      <button class="cancel-btn font-600-13-5px flex items-center gap-7px px-20px rounded-full-lg border-1-5px bg-white text-ink-900 cursor-pointer transition-btn" id="cancelBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="w-14px h-14px"><path d="M18 6 6 18M6 6l12 12"/></svg>
        Cancel
      </button>
    </div>

    <!-- RESULT -->
    <div class="panel flex-col items-center" id="panel-result" hidden>
      <div class="card-header flex items-center justify-between mb-4px">
        <span class="card-title font-weight-600">Voice Navigation</span>
        </button>
      </div>

      <div class="result-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="w-30px h-30px text-success"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <p class="result-command font-600-16px m-0-0-6px" id="resultCommand">Opening Aadhaar</p>
      <p class="result-sub font-13px text-ink-500 mb-24px">Command recognized</p>
    </div>

  </div>

  <p class="caption font-12-5px text-ink-500 text-center">Tap the mic, or tap a suggestion to try it instantly.</p>
</div>

<script src="script.js"></script>
</body>
</html>
